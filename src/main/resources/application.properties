spring.application.name=SHOP_E
server.port=${PORT:8080}

# Database Configuration (Mặc định H2 MySQL-mode để chạy ngay lập tức; hỗ trợ override qua biến môi trường hoặc profile mysql)
spring.datasource.url=${DB_URL:jdbc:h2:mem:shop_e_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (phục vụ kiểm tra nhanh CSDL tại /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
