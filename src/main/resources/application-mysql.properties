# Cấu hình kết nối MySQL thực tế (Kích hoạt bằng: --spring.profiles.active=mysql)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/shop_e?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

